<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
  :root {
    --bg-body: #1a1a1a;
    --bg-calc: #202020;
    --bg-display: #202020;
    --text: white;
    --btn-bg: #3d3d3d;
    --btn-hover: #505050;
    --eq-bg: #ff9500;
    --eq-hover: #ffab33;
    --toggle-bg: #3d3d3d;
  }
  body.light-mode {
    --bg-body: #f0f0f0;
    --bg-calc: #ffffff;
    --bg-display: #ffffff;
    --text: #1a1a1a;
    --btn-bg: #e6e6e6;
    --btn-hover: #d4d4d4;
    --eq-bg: #ff9500;
    --eq-hover: #ffab33;
    --toggle-bg: #e6e6e6;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: var(--bg-body);
    font-family: Segoe UI, Arial, sans-serif;
  }
  .calculator {
    width: 280px;
    background: var(--bg-calc);
    border-radius: 8px;
    padding: 16px;
    position: relative;
  }
  #theme-toggle {
    position: absolute;
    top: -40px;
    right: 0;
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    background: var(--toggle-bg);
    color: var(--text);
    font-size: 16px;
    line-height: 32px;
  }
  #display {
    width: 100%;
    box-sizing: border-box;
    height: 70px;
    background: var(--bg-display);
    color: var(--text);
    border: none;
    text-align: right;
    font-size: 32px;
    margin-bottom: 12px;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  button {
    padding: 20px 0;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button.operator { background: var(--btn-bg); }
  button.equals { background: var(--eq-bg); color: white; }
  button.equals:hover { background: var(--eq-hover); }
  button.span-2 { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calculator">
    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
    <input id="display" value="0" readonly>
    <div class="buttons">
      <button onclick="clearAll()">C</button>
      <button onclick="toggleSign()">±</button>
      <button onclick="append('%')" class="operator">%</button>
      <button onclick="append('/')" class="operator">÷</button>

      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button onclick="append('*')" class="operator">×</button>

      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('-')" class="operator">-</button>

      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('+')" class="operator">+</button>

      <button onclick="append('0')" class="span-2">0</button>
      <button onclick="append('.')">.</button>
      <button onclick="calculate()" class="equals">=</button>
    </div>
  </div>

<script>
let expression = "";

function applyTheme(isLight) {
  document.body.classList.toggle("light-mode", isLight);
  document.getElementById("theme-toggle").textContent = isLight ? "☀️" : "🌙";
}

function toggleTheme() {
  const isLight = !document.body.classList.contains("light-mode");
  applyTheme(isLight);
  localStorage.setItem("theme", isLight ? "light" : "dark");
}

applyTheme(localStorage.getItem("theme") === "light");

function updateDisplay() {
  document.getElementById("display").value = expression || "0";
}

function append(value) {
  expression += value;
  updateDisplay();
}

function clearAll() {
  expression = "";
  updateDisplay();
}

function toggleSign() {
  if (expression) {
    expression = expression.startsWith("-") ? expression.slice(1) : "-" + expression;
    updateDisplay();
  }
}

async function calculate() {
  try {
    const response = await fetch("/calculate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ expression: expression.replace(/%/g, "/100") })
    });
    const data = await response.json();
    if (response.ok) {
      expression = String(data.result);
    } else {
      expression = "";
      document.getElementById("display").value = "Error";
      return;
    }
  } catch (e) {
    expression = "";
    document.getElementById("display").value = "Error";
    return;
  }
  updateDisplay();
}
</script>
</body>
</html>
